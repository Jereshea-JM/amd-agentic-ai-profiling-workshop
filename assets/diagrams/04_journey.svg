<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1020" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8"
            markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8"
            markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ED1C24"/>
    </marker>
  </defs>
<rect x="0" y="0" width="900" height="300" rx="14" fill="#FFFFFF"/><text x="450.0" y="40" font-size="22" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Three approaches, one input</text><text x="450.0" y="64" font-size="14" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">From cloud convenience to a fully local, GPU-optimized tool</text><rect x="20" y="92" width="268" height="176" rx="12" fill="#FFFFFF" stroke="#F08418" stroke-width="1.5" filter="url(#shadow)"/><rect x="20" y="92" width="268" height="46" rx="12" fill="#F08418"/><rect x="20" y="116" width="268" height="22" fill="#F08418"/><text x="154.0" y="122" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Edge TTS</text><rect x="97.6" y="149" width="112.8" height="22" rx="11" fill="#F08418" opacity="0.14"/><text x="154.0" y="164" font-size="12.5" fill="#F08418" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Cloud baseline</text><circle cx="42" cy="186" r="3" fill="#F08418"/><text x="54" y="190" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Default provider, zero setup</text><circle cx="42" cy="210" r="3" fill="#F08418"/><text x="54" y="214" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">5,000-char input cap</text><circle cx="42" cy="234" r="3" fill="#F08418"/><text x="54" y="238" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Text leaves the machine</text><line x1="292" y1="180.0" x2="312.0" y2="180.0" stroke="#ED1C24" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrowred)"/><rect x="316.0" y="92" width="268" height="176" rx="12" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5" filter="url(#shadow)"/><rect x="316.0" y="92" width="268" height="46" rx="12" fill="#2E6DB4"/><rect x="316.0" y="116" width="268" height="22" fill="#2E6DB4"/><text x="450.0" y="122" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Kokoro · sequential</text><rect x="393.6" y="149" width="112.8" height="22" rx="11" fill="#2E6DB4" opacity="0.14"/><text x="450.0" y="164" font-size="12.5" fill="#2E6DB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Local baseline</text><circle cx="338.0" cy="186" r="3" fill="#2E6DB4"/><text x="350.0" y="190" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Runs on MI300X, data stays local</text><circle cx="338.0" cy="210" r="3" fill="#2E6DB4"/><text x="350.0" y="214" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">One sentence per GPU pass</text><circle cx="338.0" cy="234" r="3" fill="#2E6DB4"/><text x="350.0" y="238" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Correct, but under-uses the GPU</text><line x1="588.0" y1="180.0" x2="608.0" y2="180.0" stroke="#ED1C24" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrowred)"/><rect x="612.0" y="92" width="268" height="176" rx="12" fill="#FFFFFF" stroke="#1EAAB4" stroke-width="1.5" filter="url(#shadow)"/><rect x="612.0" y="92" width="268" height="46" rx="12" fill="#1EAAB4"/><rect x="612.0" y="116" width="268" height="22" fill="#1EAAB4"/><text x="746.0" y="122" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Kokoro · batched</text><rect x="682.4" y="149" width="127.2" height="22" rx="11" fill="#1EAAB4" opacity="0.14"/><text x="746.0" y="164" font-size="12.5" fill="#1EAAB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Local, optimized</text><circle cx="634.0" cy="186" r="3" fill="#1EAAB4"/><text x="646.0" y="190" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Many sentences per GPU pass</text><circle cx="634.0" cy="210" r="3" fill="#1EAAB4"/><text x="646.0" y="214" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Length bucketing + masks</text><circle cx="634.0" cy="234" r="3" fill="#1EAAB4"/><text x="646.0" y="238" font-size="12.8" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Same audio, far higher throughput</text></svg>