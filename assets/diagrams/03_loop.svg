hor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">5</text><text x="815.0" y="138" font-size="16" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Measure</text><text x="805.0" y="170" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">again</text><path d="M 860 212 q 0 34 -820 0" fill="none" stroke="#ED1C24" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowred)"/><text x="450.0" y="250" font-size="13" fill="#ED1C24" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">repeat until the bottleneck is gone</text></svg>