<rect x="0" y="0" width="900" height="260" rx="14" fill="#FFFFFF"/><text x="450.0" y="40" font-size="22" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">The observability-driven loop</text><text x="450.0" y="64" font-size="14" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">The same five moves for any agent task, not just TTS</text><rect x="20" y="108" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#ED1C24" stroke-width="1.5" filter="url(#shadow)"/><circle cx="46" cy="134" r="15" fill="#ED1C24"/><text x="46" y="139" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">1</text><text x="105.0" y="138" font-size="16" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Run</text><text x="95.0" y="170" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">the agent</text><line x1="174" y1="156.0" x2="193.5" y2="156.0" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="197.5" y="108" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.5" filter="url(#shadow)"/><circle cx="223.5" cy="134" r="15" fill="#2E6DB4"/><text x="223.5" y="139" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">2</text><text x="282.5" y="138" font-size="16" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Fetch</text><text x="272.5" y="170" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">in dashboard</text><line x1="351.5" y1="156.0" x2="371.0" y2="1